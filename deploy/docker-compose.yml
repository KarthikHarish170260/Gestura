version: "3.8"

services:
  sidecar:
    build:
      context: ..
      dockerfile: services/sidecar/Dockerfile
    container_name: gestura-sidecar
    ports:
      - "8000:8000"
    environment:
      - GESTURA_HOST=0.0.0.0
      - GESTURA_PORT=8000
      - GESTURA_AUTH_TOKEN=docker-compose-dev-token
    restart: unless-stopped
    networks:
      - gestura-net

  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: gestura-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped
    networks:
      - gestura-net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: gestura-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - gestura-net

networks:
  gestura-net:
    driver: bridge
