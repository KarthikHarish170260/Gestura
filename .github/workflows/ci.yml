name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install Python dependencies
        run: |
          uv venv .venv
          uv pip install -e .[dev]

      - name: Lint with Ruff
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: Type check with Mypy
        run: |
          .venv/bin/mypy services/sidecar ml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Lint and typecheck frontend
        run: |
          npm run lint
          npm run typecheck

  test:
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install Python dependencies
        run: |
          uv venv .venv
          uv pip install -e .[dev]

      - name: Run Python unit tests with coverage
        run: |
          .venv/bin/pytest --cov=services/sidecar/gestura_sidecar --cov=ml --cov-report=xml tests/unit/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Run Vitest frontend tests
        run: npm run test
